<!doctype html>
<html lang="fr" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#203361" />
    <link rel="manifest" href="/manifest.json" />
    <title>ELECTROZEN Mobile — Scanner, Prix & POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        background: var(--canvas-bg);
        margin: 0;
        font-family: 'Albert Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ink-900);
        padding-bottom: 84px;
        overflow-y: auto !important;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      .mob-shell {
        max-width: 520px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .mob-header {
        background: var(--primary);
        color: #ffffff;
        padding: 13px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 30;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 4px 16px rgba(32, 51, 97, 0.16);
      }
      .mob-main {
        padding: 14px;
        flex: 1;
        animation: unicomFadeUp 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .mob-nav-wrap {
        position: fixed;
        bottom: 10px;
        left: 12px;
        right: 12px;
        z-index: 40;
        max-width: 496px;
        margin: 0 auto;
      }
      .mob-nav {
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 5px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        box-shadow: 0 8px 28px rgba(16, 24, 40, 0.12);
      }
      .mob-nav-btn {
        background: transparent;
        border: none;
        border-radius: 10px;
        padding: 8px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-400);
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .mob-nav-btn svg {
        width: 17px;
        height: 17px;
        stroke-width: 1.95;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .mob-nav-btn:active {
        transform: scale(0.95);
      }
      .mob-nav-btn.active {
        color: var(--primary);
        font-weight: 800;
        background: var(--primary-4);
      }
      .mob-nav-btn.active svg {
        color: var(--secondary);
        transform: translateY(-1px) scale(1.06);
      }
      .mob-card {
        background: var(--panel-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
        box-shadow: var(--shadow-1);
      }
      .tier-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .tier-box {
        padding: 11px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--primary-4);
      }
      .tier-box.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(32, 51, 97, 0.22);
      }
      .video-box {
        width: 100%;
        height: 210px;
        background: #101828;
        border-radius: 10px;
        border: 2px solid var(--secondary);
        overflow: hidden;
        position: relative;
        margin-top: 10px;
      }
      .video-box video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="mobile-root"></div>
    <script type="module" src="/mobile.js"></script>
  </body>
</html>
